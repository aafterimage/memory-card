<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Memory Card — Every PS2 Game</title>
<meta name="description" content="A running log of what I've played, what I'm playing, and what I bounced off, pulled from a catalog of every PS2 game." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.mc{
  --bg:#0a0a1a;--bg2:#0f0f24;--bg3:#141432;--bg4:#1a1a40;
  --b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.12);--b3:rgba(255,255,255,.2);
  --tx:#eaeaf5;--tx2:#a4a4d0;--tx3:#7a7aa8;
  --ac:#a5b4fc;--ac2:#4f46e5;
  --inprog:#fbbf24;--done:#86efac;--queued:#a4a4d0;--played:#f87171;
  --fd:"Inter",ui-sans-serif,system-ui,sans-serif;
  --fb:"Work Sans",ui-sans-serif,system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,monospace;
  background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;line-height:1.55;
  font-feature-settings:"ss01","lnum","tnum";font-variant-numeric:tabular-nums lining-nums;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
.mc .wrap{max-width:1180px;margin:0 auto;padding:0 48px}
.mc .hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--b1);flex-wrap:wrap;gap:12px}
.mc .hdr-brand{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.mc .hdr-mark{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--ac)}
.mc .hdr-name{font-family:var(--fd);font-size:19px;font-weight:500;color:var(--tx);letter-spacing:-.01em}
.mc .hdr-nav{display:flex;gap:24px;font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--tx2)}
.mc .hdr-nav a{color:var(--tx2);text-decoration:none;cursor:pointer;transition:color .15s}
.mc .hdr-nav a:hover{color:var(--ac)}
.mc .mast{padding:56px 0 40px;border-bottom:1px solid var(--b1);text-align:center}
.mc .mast-eyebrow{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--ac);margin-bottom:18px}
.mc .mast-h1{font-family:var(--fd);font-feature-settings:"ss02","cv11";font-size:44px;font-weight:400;line-height:1.05;letter-spacing:-.02em;color:var(--tx);margin-bottom:14px}
.mc .mast-h1 em{font-weight:500;color:var(--ac);font-style:normal}
.mc .mast-sub{font-family:var(--fd);font-size:17px;font-weight:400;color:var(--tx2);max-width:560px;margin:0 auto;line-height:1.45}
.mc .mast-stats{display:flex;gap:48px;justify-content:center;margin-top:36px;padding-top:28px;border-top:1px solid var(--b1);flex-wrap:wrap}
.mc .mast-stat{text-align:center}
.mc .mast-stat .v{font-family:var(--fd);font-size:28px;font-weight:500;line-height:1;color:var(--tx)}
.mc .mast-stat .v em{font-weight:500;color:var(--ac);font-style:normal}
.mc .mast-stat .l{font-family:var(--fm);font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);margin-top:6px}
.mc .spot{padding:64px 0;border-bottom:1px solid var(--b1)}
.mc .spot-lbl{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--ac);margin-bottom:28px;display:flex;align-items:center;gap:10px}
.mc .spot-lbl::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--inprog);box-shadow:0 0 10px var(--inprog);animation:memoryCardPulse 1.6s ease-in-out infinite}
@keyframes memoryCardPulse{0%,100%{opacity:1}50%{opacity:.4}}
.mc .spot-grid{display:grid;grid-template-columns:280px 1fr 260px;gap:48px;align-items:start}
.mc .spot-side{display:flex;flex-direction:column;gap:18px;padding-top:8px;border-left:1px solid var(--b1);padding-left:28px}
.mc .spot-side-lbl{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--tx3)}
.mc .spot-queue{display:flex;flex-direction:column;gap:14px}
.mc .spot-q-row{display:flex;gap:12px;align-items:center}
.mc .spot-q-thumb{width:44px;height:60px;flex-shrink:0;background:var(--bg3);overflow:hidden}
.mc .spot-q-thumb svg,.mc .spot-q-thumb img{display:block;width:100%;height:100%}
.mc .spot-q-body{min-width:0;flex:1}
.mc .spot-q-title{font-family:var(--fd);font-size:13px;font-weight:500;color:var(--tx);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .spot-q-dev{font-family:var(--fb);font-size:12px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .spot-q-meta{font-family:var(--fm);font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3);margin-top:4px}
.mc .search-row{padding:28px 0 8px;display:flex;flex-direction:column;gap:8px}
.mc .search-lbl{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--tx3)}
.mc .search-input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--b2);color:var(--tx);padding:10px 0;font-family:var(--fb);font-size:15px;outline:none;transition:border-color .15s}
.mc .search-input::placeholder{color:var(--tx3)}
.mc .search-input:focus{border-bottom-color:var(--ac)}
.mc .filter-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mc .filter-pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--tx2);background:transparent;border:1px solid var(--b2);padding:8px 14px;cursor:pointer;transition:all .15s}
.mc .filter-pill:hover{border-color:var(--ac);color:var(--ac)}
.mc .filter-pill.on{border-color:var(--ac);color:var(--ac);background:rgba(165,180,252,.08)}
.mc .filter-pill .fc,.mc .tag-pill .fc{font-size:9px;opacity:.7;letter-spacing:.1em;font-weight:500}
.mc .tag-bar{margin-top:18px;padding-top:16px;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:10px}
.mc .tag-bar-lbl{font-family:var(--fm);font-size:9px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--tx3)}
.mc .tag-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mc .tag-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);background:transparent;border:1px solid var(--b2);padding:5px 10px;cursor:pointer;transition:all .15s}
.mc .tag-pill:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.mc .tag-pill.on{border-color:var(--ac);color:var(--ac)}
.mc .tag-pill:disabled{opacity:.3;cursor:not-allowed}
.mc .tag-clear{font-family:var(--fm);font-size:10px;font-weight:500;color:var(--tx2);background:transparent;border:0;padding:5px 8px;cursor:pointer;letter-spacing:.1em;text-transform:uppercase}
.mc .tag-clear:hover{color:var(--ac)}
.mc .spot-cover{width:280px;aspect-ratio:2/3;background:var(--bg3);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.mc .spot-cover svg{display:block;width:100%;height:100%}
.mc .spot-body{padding-top:8px}
.mc .spot-idx{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--tx3);text-transform:uppercase}
.mc .spot-title{font-family:var(--fd);font-feature-settings:"ss02","cv11";font-size:42px;font-weight:400;line-height:1.05;letter-spacing:-.02em;color:var(--tx);margin:10px 0 6px}
.mc .spot-credit{font-family:var(--fb);font-size:14px;color:var(--tx2)}
.mc .spot-credit b{color:var(--tx);font-weight:600;font-style:normal}
.mc .spot-thoughts{font-family:var(--fd);font-size:17px;line-height:1.5;color:var(--tx);margin:24px 0;max-width:540px;border-left:2px solid var(--ac);padding-left:18px}
.mc .spot-meta{display:flex;flex-wrap:wrap;gap:28px 40px;padding-top:22px;border-top:1px solid var(--b1)}
.mc .spot-meta > div{display:flex;flex-direction:column;gap:5px}
.mc .spot-meta dt{font-family:var(--fm);font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3)}
.mc .spot-meta dd{font-family:var(--fb);font-size:14px;color:var(--tx);font-weight:500}
.mc .spot-meta dd.acc{color:var(--ac)}
.mc .spot-rating{font-size:22px;letter-spacing:.08em;color:var(--ac)}
.mc .spot-rating span{color:var(--tx3)}
.mc .results{display:flex;align-items:center;justify-content:space-between;padding:24px 0 14px;border-bottom:1px solid var(--b2);font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3);flex-wrap:wrap;gap:12px}
.mc .results .filters{display:flex;gap:18px;flex-wrap:wrap}
.mc .results .filters button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
.mc .results .filters button.on{color:var(--ac)}
.mc .ledger{padding-bottom:80px}
.mc .entry{display:grid;grid-template-columns:56px 64px 1fr 110px 60px;gap:24px;padding:20px 12px;border-bottom:1px solid var(--b1);align-items:start;cursor:pointer;transition:background .15s}
.mc .entry:hover{background:rgba(165,180,252,.03)}
.mc .entry .num{font-family:var(--fm);font-size:11px;font-weight:500;color:var(--tx3);padding-top:24px;letter-spacing:.05em}
.mc .entry .cover{width:64px;aspect-ratio:2/3;background:var(--bg3);box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);overflow:hidden;transition:transform .15s}
.mc .entry:hover .cover{transform:translateY(-2px)}
.mc .entry .cover svg{display:block;width:100%;height:100%}
.mc .entry .body{min-width:0;padding-top:4px}
.mc .entry .ttl{font-family:var(--fd);font-feature-settings:"ss02","cv11";font-size:20px;font-weight:400;line-height:1.15;letter-spacing:-.01em;color:var(--tx)}
.mc .entry:hover .ttl{color:var(--ac)}
.mc .entry .credit{font-family:var(--fb);font-size:12px;color:var(--tx2);margin-top:4px}
.mc .entry .credit b{color:var(--tx);font-weight:500}
.mc .entry .thoughts{font-family:var(--fd);font-size:14px;color:var(--tx2);margin-top:8px;line-height:1.5;max-width:52ch;border-left:1px solid rgba(165,180,252,.3);padding-left:12px}
.mc .entry .side{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.mc .entry .status{font-family:var(--fm);font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.mc .status .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.mc .s-prog{color:var(--inprog)}.mc .s-prog .dot{background:var(--inprog);box-shadow:0 0 8px var(--inprog)}
.mc .s-done{color:var(--done)}.mc .s-done .dot{background:var(--done)}
.mc .s-queue{color:var(--queued)}.mc .s-queue .dot{background:var(--queued);opacity:.5}
.mc .s-played{color:var(--played)}.mc .s-played .dot{background:var(--played)}
.mc .entry .time{font-family:var(--fm);font-size:10px;color:var(--tx3);letter-spacing:.05em}
.mc .entry .stars{font-size:14px;letter-spacing:.06em;color:var(--ac);text-align:right;padding-top:8px}
.mc .entry .stars span{color:var(--tx3)}
.mc .pag{display:flex;justify-content:space-between;align-items:center;padding:32px 0;font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);border-top:1px solid var(--b2);margin-top:24px;flex-wrap:wrap;gap:14px}
.mc .pag button{background:transparent;border:1px solid var(--b2);color:var(--tx2);padding:10px 18px;font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.mc .pag button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.mc .pag button:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:760px){
  .mc .mast-h1{font-size:34px}
  .mc .spot-grid{grid-template-columns:1fr;gap:32px}
  .mc .spot-side{border-left:0;border-top:1px solid var(--b1);padding-left:0;padding-top:24px}
  .mc .spot-cover{width:200px;margin:0 auto}
  .mc .spot-title{font-size:32px}
  .mc .entry{grid-template-columns:44px 1fr 90px;gap:14px}
  .mc .entry .num,.mc .entry .time,.mc .entry .cover{display:none}
  .mc .entry .ttl{font-size:18px}
}


/* Loading splash */
.mc #loading{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
.mc #loading.done{opacity:0;pointer-events:none}
.mc .load-title{font-family:var(--fd);font-weight:500;font-size:24px;color:var(--tx);letter-spacing:-.02em}
.mc .load-sub{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--ac)}
.mc .load-dots{display:flex;gap:6px}
.mc .load-dot{width:4px;height:4px;background:var(--ac);opacity:.3;animation:mcPulse 1.2s ease-in-out infinite}
.mc .load-dot:nth-child(2){animation-delay:.2s}.mc .load-dot:nth-child(3){animation-delay:.4s}
@keyframes mcPulse{0%,100%{opacity:.2}50%{opacity:1}}
.mc .load-err{font-family:var(--fm);font-size:11px;color:#e05050;display:none}

/* PAT panel */
.mc .hdr-actions{display:flex;align-items:center;gap:14px;position:relative}
.mc .unlock-btn{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;background:transparent;border:1px solid var(--b2);color:var(--tx2);padding:8px 12px;cursor:pointer;transition:all .15s}
.mc .unlock-btn:hover{border-color:var(--ac);color:var(--ac)}
.mc .unlock-btn.on{border-color:var(--ac);color:var(--ac);background:rgba(165,180,252,.06)}
.mc .pat-panel{position:absolute;top:calc(100% + 10px);right:0;background:var(--bg2);border:1px solid var(--b2);padding:16px;width:280px;display:none;z-index:200}
.mc .pat-panel.vis{display:block}
.mc .pat-lbl{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px;display:block}
.mc .pat-input{width:100%;background:var(--bg);border:1px solid var(--b2);color:var(--tx);padding:9px 11px;font-family:var(--fm);font-size:12px;outline:none;margin-bottom:8px}
.mc .pat-input:focus{border-color:var(--ac)}
.mc .pat-submit{width:100%;background:var(--ac);border:0;color:var(--bg);padding:10px;font-family:var(--fm);font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.mc .pat-submit:hover{background:#fff}
.mc .pat-err{font-family:var(--fm);font-size:11px;color:#e05050;margin-top:8px;display:none}
.mc .pat-hint{font-family:var(--fb);font-size:11px;color:var(--tx3);margin-top:10px;line-height:1.5}

/* Modal */
.mc .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.mc .modal-box{background:var(--bg2);border:1px solid var(--b2);width:540px;max-width:100%;max-height:90vh;overflow-y:auto;padding:32px}
.mc .modal-title{font-family:var(--fd);font-weight:500;font-size:26px;color:var(--tx);margin-bottom:6px;line-height:1.1;letter-spacing:-.02em}
.mc .modal-meta{font-family:var(--fm);font-size:10px;color:var(--tx2);margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--b1);text-transform:uppercase;letter-spacing:.18em}
.mc .modal-section{margin-bottom:22px}
.mc .modal-lbl{font-family:var(--fm);font-size:9px;color:var(--ac);letter-spacing:.22em;margin-bottom:10px;display:block;text-transform:uppercase;font-weight:600}
.mc .status-btns{display:flex;gap:6px;flex-wrap:wrap}
.mc .status-btn{font-family:var(--fm);font-size:10px;font-weight:600;padding:8px 12px;border:1px solid var(--b2);color:var(--tx2);background:transparent;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.18em}
.mc .status-btn:hover{border-color:var(--b3);color:var(--tx)}
.mc .status-btn.on-queued{border-color:var(--tx2);color:var(--tx)}
.mc .status-btn.on-inprogress{border-color:var(--inprog);color:var(--inprog)}
.mc .status-btn.on-played{border-color:var(--played);color:var(--played)}
.mc .status-btn.on-completed{border-color:var(--done);color:var(--done)}
.mc .date-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc .date-group{display:flex;flex-direction:column;gap:6px}
.mc .modal-date,.mc .modal-num,.mc .modal-ta{background:var(--bg);border:1px solid var(--b2);color:var(--tx);padding:9px 11px;font-family:var(--fm);font-size:13px;outline:none;transition:border-color .15s;color-scheme:dark}
.mc .modal-date:focus,.mc .modal-num:focus,.mc .modal-ta:focus{border-color:var(--ac)}
.mc .modal-date{width:100%}
.mc .modal-num{width:76px}
.mc .modal-ta{width:100%;font-family:var(--fd);font-size:14px;resize:vertical;min-height:96px;line-height:1.55}
.mc .modal-ta::placeholder{color:var(--tx3)}
.mc .time-row{display:flex;align-items:center;gap:10px}
.mc .time-sep{font-family:var(--fm);font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.18em}
.mc .star-row{display:flex;align-items:center;gap:6px}
.mc .star-btn{font-size:22px;color:rgba(255,255,255,.12);background:transparent;border:0;cursor:pointer;padding:0 2px;line-height:1;transition:color .1s}
.mc .star-btn.lit,.mc .star-btn:hover{color:var(--ac)}
.mc .star-val{font-family:var(--fm);font-size:10px;color:var(--tx2);margin-left:8px;letter-spacing:.18em;text-transform:uppercase}
.mc .tag-picker{display:flex;flex-wrap:wrap;gap:6px}
.mc .tag-opt{font-family:var(--fm);font-size:10px;font-weight:500;padding:6px 10px;border:1px solid var(--b2);color:var(--tx2);background:transparent;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.1em}
.mc .tag-opt:hover{border-color:var(--b3);color:var(--tx)}
.mc .tag-opt.sel{border-color:var(--ac);color:var(--ac)}
.mc .modal-acts{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--b1)}
.mc .btn-save{background:var(--ac);border:0;color:var(--bg);padding:10px 22px;font-family:var(--fm);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .15s}
.mc .btn-save:hover:not(:disabled){background:#fff}
.mc .btn-save:disabled{opacity:.4;cursor:default}
.mc .btn-cancel{background:transparent;border:1px solid var(--b2);color:var(--tx2);padding:10px 16px;font-family:var(--fm);font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.18em}
.mc .btn-cancel:hover{border-color:var(--b3);color:var(--tx)}
.mc .save-status{font-family:var(--fm);font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.18em}

/* Toast */
.mc .toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--b2);border-left:2px solid var(--ac);padding:12px 18px;font-family:var(--fm);font-size:10px;color:var(--tx);z-index:9998;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;text-transform:uppercase;letter-spacing:.18em}
.mc .toast.vis{opacity:1;transform:translateY(0)}
.mc .toast.err{border-left-color:#e05050;color:#e05050}

/* Edit affordances on rows */
.mc .entry .edit-row-btn{font-family:var(--fm);font-size:9px;font-weight:600;background:transparent;border:1px solid var(--b2);color:var(--tx2);padding:4px 9px;cursor:pointer;text-transform:uppercase;letter-spacing:.18em;margin-top:8px;align-self:flex-start}
.mc .entry .edit-row-btn:hover{border-color:var(--ac);color:var(--ac)}
.mc .entry.expanded{background:rgba(165,180,252,.025)}
.mc .entry .dates{font-family:var(--fm);font-size:10px;color:var(--tx3);margin-top:8px;letter-spacing:.12em;text-transform:uppercase}
.mc .entry .game-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mc .entry .game-tag{font-family:var(--fm);font-size:9px;padding:3px 8px;background:transparent;color:var(--tx2);border:1px solid var(--b2);cursor:pointer;text-transform:uppercase;letter-spacing:.12em}

<div class="mc" id="app-shell">

<div id="loading" role="status" aria-live="polite">
  <div class="load-title">Memory Card</div>
  <div class="load-sub">Every PS2 Game</div>
  <div class="load-dots" aria-hidden="true"><div class="load-dot"></div><div class="load-dot"></div><div class="load-dot"></div></div>
  <div class="load-err" id="load-err" role="alert"></div>
</div>

<div class="modal-ov" id="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-meta" id="modal-meta"></div>

    <div class="modal-section">
      <label class="modal-lbl">Status</label>
      <div class="status-btns">
        <button class="status-btn" data-s="queued">Queued</button>
        <button class="status-btn" data-s="inprogress">In progress</button>
        <button class="status-btn" data-s="played">Dropped</button>
        <button class="status-btn" data-s="completed">Completed</button>
      </div>
    </div>

    <div class="modal-section" id="dates-section" style="display:none">
      <div class="date-row" id="date-row"></div>
    </div>

    <div class="modal-section" id="time-section" style="display:none">
      <label class="modal-lbl">Time played</label>
      <div class="time-row">
        <input type="number" class="modal-num" id="edit-h" min="0" placeholder="0">
        <span class="time-sep">h</span>
        <input type="number" class="modal-num" id="edit-m" min="0" max="59" placeholder="0">
        <span class="time-sep">m</span>
      </div>
    </div>

    <div class="modal-section" id="rating-section" style="display:none">
      <label class="modal-lbl">Rating</label>
      <div class="star-row" id="star-row">
        <button class="star-btn" data-n="1">★</button>
        <button class="star-btn" data-n="2">★</button>
        <button class="star-btn" data-n="3">★</button>
        <button class="star-btn" data-n="4">★</button>
        <button class="star-btn" data-n="5">★</button>
        <span class="star-val" id="star-val"></span>
      </div>
    </div>

    <div class="modal-section">
      <label class="modal-lbl">Tags</label>
      <div class="tag-picker" id="tag-picker"></div>
    </div>

    <div class="modal-section">
      <label class="modal-lbl">Thoughts</label>
      <textarea class="modal-ta" id="edit-thoughts" placeholder="Notes, impressions, memories..."></textarea>
    </div>

    <div class="modal-acts">
      <span class="save-status" id="save-status"></span>
      <div style="display:flex;gap:8px">
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
        <button class="btn-save" id="btn-save">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<div id="app"></div>
</div>

// ── GitHub API ───────────────────────────────────────────────────────────────
async function ghLoad(){
  const res = await fetch(GH.url, {headers:{"Accept":"application/vnd.github.v3+json"}});
  if(res.status === 404) return {};
  if(!res.ok) throw new Error("HTTP "+res.status);
  const json = await res.json();
  S.sha = json.sha;
  try {
    return JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\n/g,"")))));
  } catch(e){ return {}; }
}

async function ghSave(data){
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  const body = {message:"Update progress",content};
  if(S.sha) body.sha = S.sha;
  const res = await fetch(GH.url, {
    method:"PUT",
    headers:{"Authorization":"token "+S.pat,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
    body:JSON.stringify(body)
  });
  if(res.status === 409){
    await ghLoad();
    const body2 = {message:"Update progress",content};
    if(S.sha) body2.sha = S.sha;
    const res2 = await fetch(GH.url,{method:"PUT",headers:{"Authorization":"token "+S.pat,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},body:JSON.stringify(body2)});
    if(!res2.ok){ const e=await res2.json(); throw new Error(e.message||"Save failed"); }
    const r2 = await res2.json(); S.sha = r2.content.sha; return;
  }
  if(!res.ok){ const e=await res.json(); throw new Error(e.message||"Save failed"); }
  const r = await res.json(); S.sha = r.content.sha;
}

async function validatePat(pat){
  const res = await fetch("https://api.github.com/user",{headers:{"Authorization":"token "+pat,"Accept":"application/vnd.github.v3+json"}});
  return res.ok;
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function yr(r){const m=String(r||"").match(/\d{4}/);return m?m[0]:""}
function fmtTime(mins){if(!mins)return"";const h=Math.floor(mins/60),m=mins%60;return h&&m?h+"h "+m+"m":h?h+"h":m+"m"}
function gst(i){return(S.data[i]&&S.data[i].status)||"queued"}
function gd(i){return S.data[i]||{status:"queued"}}
function fmtDate(d){if(!d)return"";try{const dt=new Date(d+"T00:00:00");return dt.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}catch{return d}}
function pad4(n){return String(n).padStart(4,"0")}

function counts(){
  const c={queued:0,inprogress:0,played:0,completed:0};
  for(let i=0;i<GAMES.length;i++){const s=gst(i);c[s]=(c[s]||0)+1;}
  return c;
}

function filtered(){
  const q=S.search.toLowerCase().trim(),f=S.filter,tf=S.tagFilter,out=[];
  for(let i=0;i<GAMES.length;i++){
    if(f!=="all"&&gst(i)!==f)continue;
    if(q){const g=GAMES[i];if(!(g[0]+g[1]+g[2]+g[3]).toLowerCase().includes(q))continue;}
    if(tf.length){const d=gd(i);if(!d.tags||!tf.some(t=>d.tags.includes(t)))continue;}
    out.push(i);
  }
  return out;
}

function tagCounts(){
  const c={}; TAGS.forEach(t=>c[t]=0);
  for(let i=0;i<GAMES.length;i++){
    const d=gd(i);
    if(d.tags)d.tags.forEach(t=>{if(c[t]!==undefined)c[t]++;});
  }
  return c;
}

let COVERS = {};
function normTitle(t){return String(t).toLowerCase().replace(/:/g,"-").replace(/\s+/g," ").trim();}
function coverHtml(idx,spot){
  const title=GAMES[idx][0];

// ── Deterministic cover art (v15-style gradient initials) ────────────────────
const COVER_GRADIENTS = [
  ["#374151","#0a0a0a"],["#15803d","#04200f"],["#1d4ed8","#091235"],
  ["#0e7490","#022c33"],["#7f1d1d","#220607"],["#7e1a4a","#220714"],
  ["#1e293b","#020617"],["#3f0d0d","#0a0303"],["#0369a1","#03263b"],
  ["#0f172a","#01030a"],["#7c2d12","#1f0a05"],["#831843","#3f0518"],
  ["#7e22ce","#2e1065"],["#1e40af","#0a1535"],["#b45309","#2a1402"],
  ["#0c4a3e","#021510"],["#9a3412","#2a0c04"],["#4a044e","#140114"]
];
function hash32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function initials(title){
  const words=String(title).replace(/[^\w\s]/g," ").trim().split(/\s+/).filter(Boolean);
  if(words.length===1){
    const w=words[0].toUpperCase();
    return w.length<=4?w:w.slice(0,4);
  }
  return words.slice(0,4).map(w=>w[0]).join("").toUpperCase();
}
function coverSvg(idx,spot){
  const [title,studio,,rel]=GAMES[idx];
  const grad=COVER_GRADIENTS[hash32(title)%COVER_GRADIENTS.length];
  const W=spot?280:64,H=spot?420:96,scale=H/96;
  const id="g-"+idx+(spot?"-s":"");
  const txt=initials(title);
  const fontSize = txt.length<=3?22:txt.length<=4?16:txt.length<=6?12:10;
  const rings = spot?'<circle cx="'+(W/2)+'" cy="170" r="64" fill="none" stroke="#fff" stroke-width=".5" opacity=".25"/><circle cx="'+(W/2)+'" cy="170" r="42" fill="none" stroke="#fff" stroke-width=".4" opacity=".15"/>':"";
  const footer = spot?'<text x="'+(W/2)+'" y="388" text-anchor="middle" fill="#a5b4fc" font-family="JetBrains Mono" font-size="9" letter-spacing="3">'+esc((studio||"").toUpperCase())+' · '+esc(yr(rel))+'</text>':"";
  const mainText='<text x="'+(W/2)+'" y="'+(56*scale)+'" text-anchor="middle" fill="#fff" font-family="Work Sans" font-weight="600" font-size="'+(fontSize*scale)+'">'+esc(txt)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="'+grad[0]+'"/><stop offset="1" stop-color="'+grad[1]+'"/></linearGradient></defs><rect width="'+W+'" height="'+H+'" fill="url(#'+id+')"/>'+rings+mainText+footer+'</svg>';
}

        '<div class="spot-grid">'+
          '<div class="spot-cover">'+coverHtml(ipIdx,true)+'</div>'+
          '<div class="spot-body">'+
            '<div class="spot-idx">'+pad4(ipIdx+1)+'</div>'+
            '<h2 class="spot-title">'+esc(title)+'</h2>'+
            '<div class="spot-credit"><b>'+esc(studio)+'</b> · Published by '+esc(publisher)+(yr(rel)?' · '+yr(rel):'')+'</div>'+
            (d.thoughts?'<p class="spot-thoughts">'+esc(d.thoughts)+'</p>':"")+
            '<dl class="spot-meta">'+
              '<div><dt>Status</dt><dd class="acc">In Progress</dd></div>'+
              '<div><dt>Time Played</dt><dd>'+esc(timeStr)+editBtn+'</dd></div>'+
              (d.dateStarted?'<div><dt>Started</dt><dd>'+esc(fmtDate(d.dateStarted))+'</dd></div>':"")+
              '<div><dt>Rating</dt><dd class="spot-rating">'+starsHtml(d.rating)+'</dd></div>'+
            '</dl>'+
          '</div>'+
          '<aside class="spot-side">'+
            '<div class="spot-side-lbl">Up Next</div>'+
            '<div class="spot-queue">'+
              (upNext.length?upNext.map(i=>{
                const [t,dv,,r]=GAMES[i];
                return '<div class="spot-q-row" data-row="'+i+'">'+
                  '<div class="spot-q-thumb">'+coverHtml(i,false)+'</div>'+
                  '<div class="spot-q-body">'+
                    '<div class="spot-q-title">'+esc(t)+'</div>'+
                    '<div class="spot-q-dev">'+esc(dv)+(yr(r)?' · '+yr(r):'')+'</div>'+
                    '<div class="spot-q-meta">'+pad4(i+1)+'</div>'+
                  '</div>'+
                '</div>';
              }).join(""):'<div class="spot-q-meta">No queued entries.</div>')+
            '</div>'+
          '</aside>'+
        '</div>'+
      '</section>';
  }

  document.getElementById("app").innerHTML = ''+
    '<div class="wrap">'+
      '<header class="hdr">'+
        '<div class="hdr-brand">'+
          '<span class="hdr-mark">MEMORY CARD</span>'+
          '<span class="hdr-name">Every PS2 Game</span>'+
        '</div>'+
        '<div class="hdr-actions">'+
          '<a href="faq.html" style="font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#0a0a1a;background:var(--ac);padding:8px 14px;text-decoration:none;white-space:nowrap">FAQ</a>'+
          '<button class="unlock-btn'+(S.editMode?' on':'')+'" id="unlock-btn">'+(S.editMode?'Lock editing':'Unlock editing')+'</button>'+
          '<div class="pat-panel" id="pat-panel">'+
            '<label class="pat-lbl" for="pat-input">GitHub personal access token</label>'+
            '<input type="password" class="pat-input" id="pat-input" placeholder="ghp_..." autocomplete="off" spellcheck="false">'+
            '<button class="pat-submit" id="pat-submit">Unlock</button>'+
            '<div class="pat-err" id="pat-err"></div>'+
            '<div class="pat-hint">Create a fine-grained token with Contents read &amp; write on the memory-card repo only.</div>'+
          '</div>'+
        '</div>'+
      '</header>'+
      '<section class="mast">'+
        '<div class="mast-eyebrow">Est. 2026 · Updated as the disc spins</div>'+
        '<h1 class="mast-h1">Every PS2 <em>game.</em></h1>'+
        '<p class="mast-sub">A running log of what I\'ve played, what I\'m playing, and what I bounced off, pulled from a catalog of '+GAMES.length.toLocaleString()+' titles.</p>'+
        '<div class="mast-stats">'+
          '<div class="mast-stat"><div class="v"><em>'+c.completed.toLocaleString()+'</em></div><div class="l">Completed</div></div>'+
          '<div class="mast-stat"><div class="v">'+c.inprogress.toLocaleString()+'</div><div class="l">In Progress</div></div>'+
          '<div class="mast-stat"><div class="v">'+c.played.toLocaleString()+'</div><div class="l">Dropped</div></div>'+
          '<div class="mast-stat"><div class="v">'+c.queued.toLocaleString()+'</div><div class="l">Queued</div></div>'+
        '</div>'+
      '</section>'+
      spotHTML+
      '<div class="search-row">'+
        '<label class="search-lbl" for="mc-search">Keyword Search</label>'+
        '<input id="mc-search" type="search" class="search-input" placeholder="Title, developer, publisher, or year..." value="'+esc(S.search)+'" />'+
        '<div class="filter-pills">'+
          FILTERS.map(f=>'<button class="filter-pill'+(S.filter===f.key?' on':'')+'" data-filter="'+f.key+'">'+f.label+' <span class="fc">'+filterCounts[f.key].toLocaleString()+'</span></button>').join("")+
        '</div>'+
        '<div class="tag-bar">'+
          '<div class="tag-bar-lbl">Tags</div>'+
          '<div class="tag-pills">'+
            TAGS.map(t=>{const n=tc[t]||0;const on=S.tagFilter.includes(t);return '<button class="tag-pill'+(on?' on':'')+'" data-tag="'+esc(t)+'" '+(n===0?'disabled':'')+'>'+esc(t)+' <span class="fc">'+n+'</span></button>';}).join("")+
            (S.tagFilter.length?'<button class="tag-clear" data-tag-clear="1">Clear ×</button>':"")+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="results"><span>Showing '+showingFrom.toLocaleString()+'–'+end.toLocaleString()+' of '+total.toLocaleString()+'</span><span>Page '+pad4(safePage+1).slice(2)+' of '+pad4(tp).slice(2)+'</span></div>'+
      '<section class="ledger">'+
        slice.map(i=>{
          const [title,studio,publisher,rel]=GAMES[i];
          const d=gd(i),st=d.status||"queued";
          const cls=STATUS_CLS[st],lbl=SL[st];
          const mins=(d.timeH||0)*60+(d.timeM||0);
          const timeStr=fmtTime(mins);
          const hasExtra=(d.thoughts&&d.thoughts.trim())||(d.tags&&d.tags.length)||d.dateStarted||d.dateCompleted||d.dateDropped;
          const dates=[];
          if(d.dateStarted)dates.push("Started "+fmtDate(d.dateStarted));
          if(st==="played"&&d.dateDropped)dates.push("Dropped "+fmtDate(d.dateDropped));
          if(st==="completed"&&d.dateCompleted)dates.push("Completed "+fmtDate(d.dateCompleted));
          return '<article class="entry'+(hasExtra?' expanded':'')+'" data-row="'+i+'">'+
            '<div class="num">'+pad4(i+1)+'</div>'+
            '<div class="cover">'+coverHtml(i,false)+'</div>'+
            '<div class="body">'+
              '<h3 class="ttl">'+esc(title)+'</h3>'+
              '<div class="credit"><b>'+esc(studio)+'</b> · '+esc(publisher)+(yr(rel)?' · '+yr(rel):'')+'</div>'+
              (d.thoughts?'<p class="thoughts">"'+esc(d.thoughts)+'"</p>':"")+
              (dates.length?'<div class="dates">'+dates.join(" · ")+'</div>':"")+
              (d.tags&&d.tags.length?'<div class="game-tags">'+d.tags.map(t=>'<button class="game-tag" data-tag="'+esc(t)+'">'+esc(t)+'</button>').join("")+'</div>':"")+
              (S.editMode?'<button class="edit-row-btn" data-edit="'+i+'">Edit</button>':"")+
            '</div>'+
            '<div class="side">'+
              '<div class="status '+cls+'"><span class="dot"></span>'+lbl+'</div>'+
              (timeStr?'<div class="time">'+esc(timeStr)+'</div>':"")+
            '</div>'+
            '<div class="stars">'+starsHtml(d.rating)+'</div>'+
          '</article>';
        }).join("")+
        '<div class="pag">'+
          '<span>Page '+pad4(safePage+1).slice(2)+' of '+pad4(tp).slice(2)+'</span>'+
          '<div style="display:flex;gap:10px">'+
            '<button data-page="prev" '+(safePage<=0?'disabled':'')+'>← Previous</button>'+
            '<button data-page="next" '+(safePage>=tp-1?'disabled':'')+'>Next Page →</button>'+
          '</div>'+
        '</div>'+
      '</section>'+
    '</div>';

  // Event wiring (rebound each render)
  const inp=document.getElementById("mc-search");
  inp.addEventListener("input",e=>{clearTimeout(window._st);window._st=setTimeout(()=>{S.search=e.target.value;S.page=0;render();const i=document.getElementById("mc-search");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},200);});
  document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{S.filter=b.dataset.filter;S.page=0;render();}));
  document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{S.page+=b.dataset.page==="next"?1:-1;render();window.scrollTo({top:0,behavior:"smooth"});}));
  document.getElementById("unlock-btn").addEventListener("click",togglePat);
  const patSubmit=document.getElementById("pat-submit");
  if(patSubmit)patSubmit.addEventListener("click",submitPat);
  const patInput=document.getElementById("pat-input");
  if(patInput)patInput.addEventListener("keydown",e=>{if(e.key==="Enter")submitPat();});
}

// Delegated handlers (tags, rows, edit) — bind once
document.addEventListener("click",e=>{
  const clearBtn=e.target.closest("[data-tag-clear]");
  if(clearBtn){S.tagFilter=[];S.page=0;render();return;}
  const tagBtn=e.target.closest("[data-tag]");
  if(tagBtn && !tagBtn.disabled){
    const t=tagBtn.dataset.tag;
    const idx=S.tagFilter.indexOf(t);
    if(idx>=0) S.tagFilter.splice(idx,1); else S.tagFilter.push(t);
    S.page=0;render();return;
  }
  const editBtn=e.target.closest("[data-edit]");
  if(editBtn){e.stopPropagation();openEdit(parseInt(editBtn.dataset.edit,10));return;}
  const rowBtn=e.target.closest(".entry[data-row]");
  if(rowBtn && S.editMode){openEdit(parseInt(rowBtn.dataset.row,10));return;}
  const qRow=e.target.closest(".spot-q-row[data-row]");
  if(qRow){
    const i=parseInt(qRow.dataset.row,10);
    if(S.editMode){openEdit(i);} else {
      S.search=GAMES[i][0];S.page=0;render();
    }
    return;
  }
  // Close PAT panel on outside click
  const p=document.getElementById("pat-panel");
  if(p && p.classList.contains("vis")){
    const btn=document.getElementById("unlock-btn");
    if(!p.contains(e.target) && e.target!==btn){p.classList.remove("vis");}
  }
});

// ── PAT / edit mode ──────────────────────────────────────────────────────────
function togglePat(){
  if(S.editMode){S.editMode=false;S.pat=null;render();return;}
  const p=document.getElementById("pat-panel");
  p.classList.toggle("vis");
  if(p.classList.contains("vis")){
    setTimeout(()=>{const i=document.getElementById("pat-input");if(i){i.value="";i.focus();}const e=document.getElementById("pat-err");if(e)e.style.display="none";},30);
  }
}

async function submitPat(){
  const pat=document.getElementById("pat-input").value.trim();
  const err=document.getElementById("pat-err");
  if(!pat){err.textContent="Please enter your token.";err.style.display="block";return;}
  const btn=document.getElementById("pat-submit");
  btn.textContent="Checking...";btn.disabled=true;
  try{
    const ok=await validatePat(pat);
    if(ok){
      S.pat=pat;S.editMode=true;
      try{S.data=await ghLoad();}catch(_){}
      render();
    } else {
      err.textContent="Token invalid or lacks permission.";err.style.display="block";
      btn.textContent="Unlock";btn.disabled=false;
    }
  } catch(e){
    err.textContent="Could not verify token.";err.style.display="block";
    btn.textContent="Unlock";btn.disabled=false;
  }
}

// ── Modal ────────────────────────────────────────────────────────────────────
let _modalReturnFocus=null;
function openEdit(idx){
  S.editIdx=idx;
  const [title,studio,,rel]=GAMES[idx],d=gd(idx);
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-meta").textContent=studio+(yr(rel)?" · "+yr(rel):"");
  setModalStatus(d.status||"queued");
  document.getElementById("edit-h").value=d.timeH||"";
  document.getElementById("edit-m").value=d.timeM||"";
  S.curStar=d.rating||0;
  S.curTags=d.tags?[...d.tags]:[];
  renderStars();
  renderTagPicker();
  document.getElementById("edit-thoughts").value=d.thoughts||"";
  document.getElementById("save-status").textContent="";
  document.getElementById("btn-save").disabled=false;
  document.getElementById("btn-save").textContent="Save";
  _modalReturnFocus=document.activeElement;
  document.getElementById("modal").style.display="flex";
  setTimeout(()=>{const ta=document.getElementById("edit-thoughts");if(ta)ta.focus();},30);
}

function setModalStatus(s){
  document.querySelectorAll(".status-btn").forEach(b=>{b.className="status-btn"+(b.dataset.s===s?" on-"+s:"");});
  const ip=s==="inprogress",pl=s==="played",co=s==="completed",any=ip||pl||co;
  document.getElementById("time-section").style.display=any?"block":"none";
  document.getElementById("rating-section").style.display=co?"block":"none";
  document.getElementById("dates-section").style.display=any?"block":"none";
  buildDateRow(s);
}

function buildDateRow(s){
  const d=gd(S.editIdx)||{};
  let html="";
  if(s==="inprogress"){
    html='<div class="date-group"><label class="modal-lbl">Date started</label><input type="date" class="modal-date" id="ed-start" value="'+(d.dateStarted||"")+'"></div>';
  } else if(s==="played"){
    html='<div class="date-group"><label class="modal-lbl">Date started</label><input type="date" class="modal-date" id="ed-start" value="'+(d.dateStarted||"")+'"></div>'+
         '<div class="date-group"><label class="modal-lbl">Date dropped</label><input type="date" class="modal-date" id="ed-drop" value="'+(d.dateDropped||"")+'"></div>';
  } else if(s==="completed"){
    html='<div class="date-group"><label class="modal-lbl">Date started</label><input type="date" class="modal-date" id="ed-start" value="'+(d.dateStarted||"")+'"></div>'+
         '<div class="date-group"><label class="modal-lbl">Date completed</label><input type="date" class="modal-date" id="ed-done" value="'+(d.dateCompleted||"")+'"></div>';
  }
  document.getElementById("date-row").innerHTML=html;
}

function renderTagPicker(){
  document.getElementById("tag-picker").innerHTML=TAGS.map((t,i)=>
    '<button class="tag-opt'+(S.curTags.includes(t)?" sel":"")+'" data-tagpick="'+i+'">'+esc(t)+'</button>'
  ).join("");
  document.querySelectorAll("[data-tagpick]").forEach(b=>b.addEventListener("click",()=>{
    const t=TAGS[parseInt(b.dataset.tagpick,10)];
    const i=S.curTags.indexOf(t);
    if(i>=0) S.curTags.splice(i,1); else S.curTags.push(t);
    renderTagPicker();
  }));
}

function setStar(n){S.curStar=S.curStar===n?0:n;renderStars();}
function renderStars(){
  document.querySelectorAll(".star-btn").forEach(b=>{b.classList.toggle("lit",parseInt(b.dataset.n)<=S.curStar);});
  document.getElementById("star-val").textContent=S.curStar?S.curStar+"/5":"No rating";
}

function closeModal(){
  document.getElementById("modal").style.display="none";S.editIdx=null;
  if(_modalReturnFocus&&typeof _modalReturnFocus.focus==="function"){try{_modalReturnFocus.focus();}catch(_){}}
  _modalReturnFocus=null;
}

function trapModalFocus(e){
  const m=document.getElementById("modal");
  if(!m||m.style.display==="none")return;
  if(e.key==="Escape"){e.preventDefault();closeModal();return;}
  if(e.key!=="Tab")return;
  const f=m.querySelectorAll('button,[href],input,textarea,select,[tabindex]:not([tabindex="-1"])');
  const focusable=Array.from(f).filter(el=>!el.disabled&&el.offsetParent!==null);
  if(!focusable.length)return;
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}

async function saveEdit(){
  if(S.saving)return;
  S.saving=true;
  const sb=document.getElementById("btn-save"),ss=document.getElementById("save-status");
  sb.disabled=true;sb.textContent="Saving...";
  const statusBtn=document.querySelector(".status-btn[class*=\"on-\"]");
  const st=statusBtn?statusBtn.dataset.s:"queued";
  const d={status:st};
  const h=parseInt(document.getElementById("edit-h").value)||0;
  const m=parseInt(document.getElementById("edit-m").value)||0;
  if(h||m){d.timeH=h;d.timeM=m;}
  if(st==="completed"&&S.curStar)d.rating=S.curStar;
  if(S.curTags.length)d.tags=S.curTags;
  const thoughts=document.getElementById("edit-thoughts").value.trim();
  if(thoughts)d.thoughts=thoughts;
  const es=document.getElementById("ed-start");if(es&&es.value)d.dateStarted=es.value;
  const ed=document.getElementById("ed-drop");if(ed&&ed.value)d.dateDropped=ed.value;
  const ec=document.getElementById("ed-done");if(ec&&ec.value)d.dateCompleted=ec.value;
  try{
    S.data[S.editIdx]=d;
    await ghSave(S.data);
    closeModal();render();
    showToast("Saved");
  } catch(e){
    ss.textContent="Error: "+e.message;
    sb.disabled=false;sb.textContent="Save";
  }
  S.saving=false;
}

function showToast(msg,isErr){
  const t=document.getElementById("toast");
  t.textContent=msg;t.className="toast"+(isErr?" err":"");
  t.classList.add("vis");
  setTimeout(()=>t.classList.remove("vis"),2800);
}

// ── Init ─────────────────────────────────────────────────────────────────────
async function init(){
  try{
    const cr=await fetch("covers.json");
    if(cr.ok) COVERS=await cr.json();
  } catch(e){}
  try{
    S.data=await ghLoad();
    document.getElementById("loading").classList.add("done");
    render();
  } catch(e){
    document.getElementById("load-err").textContent="Could not load progress: "+e.message;
    document.getElementById("load-err").style.display="block";
    setTimeout(()=>{document.getElementById("loading").classList.add("done");render();},1500);
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  // Bind star buttons + modal close + ESC trap once
  document.querySelectorAll(".star-btn").forEach(b=>b.addEventListener("click",()=>setStar(parseInt(b.dataset.n,10))));
  document.getElementById("btn-save").addEventListener("click",saveEdit);
  document.getElementById("btn-cancel").addEventListener("click",closeModal);
  document.querySelectorAll(".status-btn").forEach(b=>b.addEventListener("click",()=>setModalStatus(b.dataset.s)));
  document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
  document.addEventListener("keydown",trapModalFocus);
  init();
});

</script>
